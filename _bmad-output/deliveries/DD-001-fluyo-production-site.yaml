  handoff_confirmed_by: king
  architect_acknowledgement: pending_direct_acknowledgement
  handoff_log: _bmad-output/deliveries/DD-001-handoff-log.md
  official_handoff_notification: _bmad-output/deliveries/DD-001-official-handoff.md
  tracker: _bmad-output/deliveries/design-deliveries-tracker.md
  designer: king
  method: Whiteport Design Studio
  delivery_type: adapted_implementation_handoff
  priority: high
  adaptation_reason: Standalone design-system generation was deferred after repeated poor token/system outputs. Production UI tokens and components will be extracted during implementation from the approved UX, verified layout schema, and available design reference assets.

scope:
  included_routes:
    - route: /
      page: Home
      purpose: Establish Fluyo, route visitors into the right learning path, show compact proof, and provide enough price clarity to continue.
    - route: /programs
      page: Learning Paths
      purpose: Gather Exam Preparation, Kids & Parents, and Adults Speaking into one comparison page.
    - route: /teachers
      page: Teachers & Proof
      purpose: Show teacher, credential, lesson, and outcome proof before deeper pricing or booking.
    - route: /pricing
      page: Trial & Pricing
      purpose: Clarify paid trial, lesson formats, included value, practical FAQ, and Telegram booking.
  excluded:
    - Rebuilding the historical 11-section single-page prototype.
    - Splitting exam, kids, and adults into separate v1 routes.
    - Shipping mock proof, mock prices, mock testimonials, or generated teacher claims as approved launch content.
    - Creating a standalone WDS design-system package before implementation.

user_value:
  problem: Visitors need to quickly understand whether Fluyo fits their exam, child, or adult speaking goal, trust the teacher-led model, see practical price clarity, and contact Telegram with useful context.
  solution: Build the finalized four-page public site with path routing, trust proof, pricing clarity, bilingual content, and centralized Telegram CTA context.
  success_criteria:
    - Visitors can choose Exam, Kids & Parents, or Adults Speaking from Home and continue to the relevant Learning Paths section.
    - Visitors can reach full pricing and open Telegram with preserved path or format context.
    - Trust-sensitive visitors can inspect teachers, credentials, lesson proof, results, testimonials, and practical FAQ before booking.
    - Ukrainian and English content have equivalent structure and do not break responsive layouts.
    - Launch-sensitive content is hidden or clearly blocked until approved.

business_value:
  primary_outcome: Qualified paid-trial Telegram inquiries.
  supporting_outcomes:
    - Higher audience-path engagement from Home.
    - Reduced manager back-and-forth through prepared inquiry context.
    - Better trust before price comparison through teacher and proof visibility.
    - Safer public launch by preventing mock content from shipping as truth.
  measurement_events:
    - path_card_click
    - program_path_view
    - price_preview_view
    - pricing_view
    - teacher_proof_view
    - telegram_click
    - telegram_context

