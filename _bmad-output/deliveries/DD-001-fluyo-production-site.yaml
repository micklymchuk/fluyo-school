  id: DD-001
  name: Fluyo School Production Four-Page Site
  status: in_development
  created: 2026-07-08
  handoff_dialog_documented_at: 2026-07-08T21:12:40+0300
  handed_off_at: 2026-07-08T21:15:52+0300
