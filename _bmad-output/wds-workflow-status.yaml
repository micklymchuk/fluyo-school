project:
  name: fluyo-school
  type: landing_page
  status: planning

config:
  brief_level: complete
  methodology_version: wds-v6
  product_complexity: simple
  tech_stack: Vue/Nuxt
  component_library: null
  strategic_analysis: full
  root_folder: _bmad-output

phases:
  phase_1_product_brief:
